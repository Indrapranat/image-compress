<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FotoLite — Kompres & Resize</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="./main.js"></script>
</head>
<body data-bs-theme="dark" class="bg-dark text-light">
  <nav class="navbar bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">FotoLite</a>
      <div class="ms-auto d-flex gap-2">
        <button id="btnClear" class="btn btn-outline-secondary">Bersihkan</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Controls -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-center">
          <div class="col-6 col-md-3">
            <label for="maxW" class="form-label mb-1">Max Lebar</label>
            <input type="number" class="form-control" id="maxW" value="1920" min="1">
          </div>
          <div class="col-6 col-md-3">
            <label for="maxH" class="form-label mb-1">Max Tinggi</label>
            <input type="number" class="form-control" id="maxH" value="1080" min="1">
          </div>
          <div class="col-12 col-md-3">
            <label for="quality" class="form-label mb-1">
              Kualitas <span id="qVal" class="badge text-bg-secondary ms-1">80%</span>
            </label>
            <input type="range" class="form-range" id="quality" min="0.1" max="1" step="0.05" value="0.8">
          </div>
          <div class="col-6 col-md-2">
            <label for="format" class="form-label mb-1">Format</label>
            <select id="format" class="form-select">
              <option value="image/jpeg">JPEG</option>
              <option value="image/webp">WEBP</option>
              <option value="image/png">PNG</option>
            </select>
          </div>
          <div class="col-6 col-md-1">
            <label for="bg" class="form-label mb-1">BG</label>
            <input type="color" id="bg" class="form-control form-control-color" value="#000000" title="Background untuk JPEG/WEBP">
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="keepName" checked>
              <label class="form-check-label" for="keepName">Pertahankan nama file</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Dropzone -->
    <div id="drop" class="dropzone card shadow-sm mb-4 text-center py-5">
      <div class="card-body">
        <input id="file" type="file" accept="image/*" class="d-none">
        <p class="lead mb-2">Tarik 1 gambar ke sini</p>
        <p class="text-secondary mb-3">atau</p>
        <button type="button" class="btn btn-outline-primary" id="btnPick">Pilih File</button>
      </div>
    </div>

    <!-- Satu kartu preview -->
    <div id="slot" class="row g-3"></div>
  </main>
</body>
</html>
